name: Daily Economic Data Pipeline
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    name: Run Daily Pipeline
    environment: pipeline
    env:
      SB_HOST: ${{ secrets.SB_HOST }}
      SB_PORT: ${{ secrets.SB_PORT }}
      SB_USER: ${{ secrets.SB_USER }}
      SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
      SB_DATABASE: ${{ secrets.SB_DATABASE }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: false

      - name: Install dependencies
        run: |
          cd extract
          poetry install --no-interaction --no-ansi --no-root

      - name: Run Pipeline
        run: |
          cd extract
          PYTHONPATH=src:. poetry run python -m src.main --log-level info

      - name: Run DBT
        working-directory: transforms
        env:
          DBT_PROFILES_DIR: .
        run: |
          VENV_BIN=$(cd ../extract && poetry env info --path)/bin
          $VENV_BIN/dbt run --select final_data
