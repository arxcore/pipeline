name: Daily Economic Data Pipeline
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    name: Run Daily Pipeline
    environment: pipeline
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: false

      - name: Install dependencies
        run: |
          cd extract
          poetry install --no-interaction --no-ansi

      - name: Run Pipeline
        env:
          SB_HOST: ${{ secrets.SB_HOST }}
          SB_PORT: ${{ secrets.SB_PORT }}
          SB_USER: ${{ secrets.SB_USER }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          SB_DATABASE: ${{ secrets.SB_DATABASE }}
        run: |
          PYTHONPATH=extract/src:extract python -m extract.src.main --log-level info

      - name: Run DBT
        env:
          SB_HOST: ${{ secrets.SB_HOST }}
          SB_PORT: ${{ secrets.SB_PORT }}
          SB_USER: ${{ secrets.SB_USER }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          SB_DATABASE: ${{ secrets.SB_DATABASE }}
        run: dbt run --select final_data
